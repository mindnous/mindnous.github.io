collections:
  services:
    output: true
  team:
    output: true
  blogs:
    output: true

sass:
  indentWidth: 4
  style: compact # possible values: nested expanded compact compressed
  precision: 10

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
  - assets/jupyter/
  - "*.ipynb"
  - DESIGN_SYSTEM.md
  - IMPROVEMENTS.md
  - CHANGES_SUMMARY.md