baseurl: '/'
permalink: pretty
title: 'Folksagent'
host: "0.0.0.0"

google_analytics_id: ""

homepage:
  show_call_box: true

logo:
  mobile: "images/favicon-32x32.svg"
  desktop: "images/logo/logo.svg"
  desktop_height: "20px"

footer:
  copyright_text: 'copyright @ Folksagent'

